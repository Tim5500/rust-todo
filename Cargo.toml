[package]
name = "rust-todo"
version = "0.1.0"
edition = "2021"
authors = ["Tim"]
description = "功能完整的 Rust Todo CLI，支持后续升级为 TUI"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"